<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How I build secure multi-tenant full-stack apps</title>
  <desc id="d">Architecture flow: Angular or React client calls an ASP.NET Core API secured with JWT and RBAC, which reads and writes tenant-isolated data in SQL Server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F0E"/>
      <stop offset="1" stop-color="#0F2A24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .flow { stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .rise { animation: rise .7s ease-out both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .sweep { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 100% { transform: translateX(900px); } }
  </style>

  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="18" fill="none" stroke="#1F7A64" stroke-opacity="0.55"/>

  <!-- header -->
  <text x="36" y="46" font-size="13" font-weight="600" letter-spacing="3" fill="#34D399">HOW I BUILD</text>
  <text x="36" y="76" font-size="22" font-weight="700" fill="#E2E8F0">Secure, multi-tenant full-stack applications</text>
  <circle class="pulse" cx="742" cy="42" r="5" fill="#22C55E"/>
  <text x="756" y="47" font-size="13" fill="#CBD5E1">Open to junior roles</text>

  <!-- connectors -->
  <path class="flow" d="M262 200 H328" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path class="flow" d="M572 200 H638" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="188" font-size="11" text-anchor="middle" fill="#94A3B8" class="mono">HTTPS</text>
  <text x="605" y="188" font-size="11" text-anchor="middle" fill="#94A3B8" class="mono">EF Core</text>

  <!-- client -->
  <g class="rise d1">
    <rect x="36" y="116" width="226" height="168" rx="14" fill="#0E1F1B" stroke="#1F7A64"/>
    <text x="56" y="146" font-size="12" font-weight="600" letter-spacing="2" fill="#34D399">CLIENT</text>
    <text x="56" y="176" font-size="19" font-weight="700" fill="#F1F5F9">Angular &amp; React</text>
    <text x="56" y="202" font-size="13" fill="#94A3B8">Responsive UIs, TypeScript,</text>
    <text x="56" y="221" font-size="13" fill="#94A3B8">Tailwind CSS</text>
    <rect x="56" y="240" width="92" height="26" rx="13" fill="#123A31" stroke="#1F7A64"/>
    <text x="102" y="257" font-size="12" text-anchor="middle" fill="#E2E8F0" class="mono">UI / UX</text>
    <rect x="156" y="240" width="86" height="26" rx="13" fill="#123A31" stroke="#1F7A64"/>
    <text x="199" y="257" font-size="12" text-anchor="middle" fill="#E2E8F0" class="mono">SPA</text>
  </g>

  <!-- api -->
  <g class="rise d2">
    <rect x="337" y="116" width="226" height="168" rx="14" fill="#0E1F1B" stroke="#34D399"/>
    <text x="357" y="146" font-size="12" font-weight="600" letter-spacing="2" fill="#34D399">API LAYER</text>
    <text x="357" y="176" font-size="19" font-weight="700" fill="#F1F5F9">ASP.NET Core</text>
    <text x="357" y="202" font-size="13" fill="#94A3B8">REST APIs, Controller-Service-</text>
    <text x="357" y="221" font-size="13" fill="#94A3B8">Repository architecture</text>
    <rect x="357" y="240" width="92" height="26" rx="13" fill="#123A31" stroke="#1F7A64"/>
    <text x="403" y="257" font-size="12" text-anchor="middle" fill="#E2E8F0" class="mono">JWT</text>
    <rect x="457" y="240" width="86" height="26" rx="13" fill="#123A31" stroke="#1F7A64"/>
    <text x="500" y="257" font-size="12" text-anchor="middle" fill="#E2E8F0" class="mono">RBAC</text>
  </g>

  <!-- data -->
  <g class="rise d3">
    <rect x="647" y="116" width="217" height="168" rx="14" fill="#0E1F1B" stroke="#1F7A64"/>
    <text x="667" y="146" font-size="12" font-weight="600" letter-spacing="2" fill="#34D399">DATA</text>
    <text x="667" y="176" font-size="19" font-weight="700" fill="#F1F5F9">SQL Server</text>
    <text x="667" y="202" font-size="13" fill="#94A3B8">Tenant-level data isolation</text>
    <rect x="667" y="218" width="52" height="48" rx="8" fill="#123A31" stroke="#1F7A64"/>
    <text x="693" y="247" font-size="11" text-anchor="middle" fill="#E2E8F0" class="mono">Tenant A</text>
    <rect x="727" y="218" width="52" height="48" rx="8" fill="#123A31" stroke="#1F7A64"/>
    <text x="753" y="247" font-size="11" text-anchor="middle" fill="#E2E8F0" class="mono">Tenant B</text>
    <rect x="787" y="218" width="52" height="48" rx="8" fill="#123A31" stroke="#1F7A64"/>
    <text x="813" y="247" font-size="11" text-anchor="middle" fill="#E2E8F0" class="mono">Tenant C</text>
  </g>

  <!-- footer line -->
  <text x="36" y="326" font-size="13" fill="#94A3B8">Built with these principles in RestaurantOS: tenant isolation, permission-aware workflows, branch-scoped data.</text>
  <rect x="0" y="352" width="300" height="3" fill="url(#line)" class="sweep"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
